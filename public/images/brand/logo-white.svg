<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" width="320" height="80" fill="none">
  <!-- Symbol: Community Tree & Sun -->
  <g transform="translate(10, 10)">
    <circle cx="30" cy="30" r="28" fill="rgba(255, 255, 255, 0.12)" />
    <!-- Sun / Gold accent -->
    <circle cx="44" cy="16" r="6" fill="#B79045" />
    <!-- Trunk / Hands -->
    <path d="M30 48 V28 M30 36 C24 30 20 24 20 18 M30 36 C36 30 40 24 40 18" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Canopy / Leaves in Gold & White -->
    <circle cx="20" cy="18" r="4.5" fill="#EAF2FA" />
    <circle cx="30" cy="14" r="5" fill="#FFFFFF" />
    <circle cx="40" cy="18" r="4.5" fill="#B79045" />
    <path d="M16 48 H44" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>
  </g>
  <!-- Wordmark -->
  <g transform="translate(80, 20)">
    <text x="0" y="24" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="800" fill="#FFFFFF" letter-spacing="-0.02em">ABWA</text>
    <text x="76" y="24" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="400" fill="#EAF2FA" letter-spacing="-0.01em">WORLD</text>
    <text x="0" y="42" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="600" fill="#B79045" letter-spacing="0.1em">ACTION FOR BETTER WORLD ASSOCIATION</text>
  </g>
</svg>
